name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint & Format (Biome)
        run: npm run check

      - name: Type Check
        run: npm run typecheck

      - name: Test & Coverage
        run: npm run coverage

      - name: Build (Next.js)
        run: npm run build
