name: Sync Google Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/01-architecture/**"
      - "docs/02-domain-models/**"
      - "scripts/sync-google-docs.mjs"
      - ".github/workflows/sync-google-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync Markdown sources to Google Docs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DOCS_ARCHITECTURE_DOC_ID: ${{ secrets.DOCS_ARCHITECTURE_DOC_ID }}
          DOCS_UBIQUITOUS_DOC_ID: ${{ secrets.DOCS_UBIQUITOUS_DOC_ID }}
        run: node scripts/sync-google-docs.mjs
